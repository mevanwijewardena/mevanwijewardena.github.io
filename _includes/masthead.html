{% include base_path %}

<div class="masthead" role="banner">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Primary navigation">
        <button aria-label="Open navigation"><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist">
            <a class="site-brand" href="{{ base_path }}/" aria-label="{{ site.title }} home">
              <span class="site-brand__mark" aria-hidden="true">MW</span>
              <span class="site-brand__name">{{ site.title }}</span>
            </a>
          </li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item{% if link.title == 'CV' %} masthead__menu-item--cta{% endif %}"><a href="{{ domain }}{{ link.url }}"{% if link.title == 'CV' %} target="_blank" rel="noopener"{% endif %}>{{ link.title }}{% if link.title == 'CV' %}<span aria-hidden="true"> &#8599;</span>{% endif %}</a></li>
          {% endfor %}
          <li id="theme-toggle" class="masthead__menu-item persist tail">
            <a class="theme-toggle__button" role="button" tabindex="0" aria-label="Toggle color theme"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i></a>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
